<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予定一覧（JSON本番版）</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding:16px;}
.range { font-size:13px;color:#555;margin-bottom:8px;}
.controls{margin-bottom:12px;}
.controls label{margin-right:12px;}
button{padding:4px 10px;margin-right:4px;margin-top:4px;}
pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;font-size:14px;}
</style>
</head>
<body>

<h2>予定一覧</h2>
<div class="range" id="rangeInfo">読込中…</div>

<div class="controls">
<label>開始日：<input type="date" id="startDate" disabled></label>
<label>開始時刻：<input type="time" id="startTime" value="00:00" disabled></label>
<label>終了日：<input type="date" id="endDate" disabled></label>
<label>終了時刻：<input type="time" id="endTime" value="23:59" disabled></label>

<br><br>

<button id="todayBtn" disabled>今日</button>
<button id="weekBtn" disabled>今週</button>
<button id="monthBtn" disabled>今月</button>
<button id="allBtn" disabled>全期間</button>
<button id="memoBtn" disabled>メモ一覧</button>
<button id="headingBtn" disabled>見出し</button>

<label>検索：<input type="text" id="keyword"></label>
<button id="loadBtn" disabled>表示</button>
<button id="copyBtn" disabled>コピー</button>
</div>

<pre id="out">初期化中…</pre>

<script>
const JSON_URL = "/api";

const startInput = document.getElementById("startDate");
const endInput = document.getElementById("endDate");
const startTimeInput = document.getElementById("startTime");
const endTimeInput = document.getElementById("endTime");
const keywordInput = document.getElementById("keyword");
const output = document.getElementById("out");

const todayBtn = document.getElementById("todayBtn");
const weekBtn = document.getElementById("weekBtn");
const monthBtn = document.getElementById("monthBtn");
const allBtn = document.getElementById("allBtn");
const memoBtn = document.getElementById("memoBtn");
const loadBtn = document.getElementById("loadBtn");
const copyBtn = document.getElementById("copyBtn");
const headingBtn = document.getElementById("headingBtn");
const rangeInfo = document.getElementById("rangeInfo");

let minDate = null;
let maxDate = null;

init();

/* ---------- 初期化 ---------- */
async function init(){
  try{
    const res = await fetch(JSON_URL,{
      headers:{
        "Authorization":"Basic "+btoa("tao:haltoto")
      }
    });

    if(!res.ok){
      output.textContent = "データ取得失敗: " + res.status;
      return;
    }

    window._allEvents = await res.json();

    if(!Array.isArray(window._allEvents) || window._allEvents.length===0){
      output.textContent = "予定がありません";
      return;
    }

    const dates = window._allEvents.map(e=>new Date(e.start));
    const min = new Date(Math.min(...dates));
    const max = new Date(Math.max(...dates));

    minDate = ymd(min);
    maxDate = ymd(max);

    startInput.value = fmt(minDate);
    endInput.value   = fmt(maxDate);

    rangeInfo.textContent = `予定期間：${fmt(minDate)} ～ ${fmt(maxDate)}`;

    enableUI();
    output.textContent="条件を指定してください";

  }catch(err){
    console.error(err);
    output.textContent="データ取得中にエラーが発生しました";
  }
}

/* ---------- 日付補正 ---------- */
startInput.onchange = ()=>{
  endInput.min = startInput.value;
  if(endInput.value < startInput.value)
    endInput.value = startInput.value;
};

/* ---------- ボタン ---------- */
todayBtn.onclick = ()=>{
  const t = clamp(ymd(new Date()));
  startInput.value = fmt(t);
  endInput.value   = fmt(t);
};

weekBtn.onclick = ()=>{
  const d=new Date();
  const w=d.getDay();
  d.setDate(d.getDate()-(w===0?6:w-1));
  startInput.value=fmt(clamp(ymd(d)));
  d.setDate(d.getDate()+6);
  endInput.value=fmt(clamp(ymd(d)));
};

monthBtn.onclick = ()=>{
  const d=new Date();
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  startInput.value=fmt(clamp(ymd(first)));
  endInput.value=fmt(clamp(ymd(last)));
};

allBtn.onclick = ()=>{
  startInput.value=fmt(minDate);
  endInput.value=fmt(maxDate);
};

loadBtn.onclick = ()=>render(false);
memoBtn.onclick = ()=>render(true);

/* ---------- 表示 ---------- */
function render(showMemo){

  const startDT = new Date(startInput.value+"T"+startTimeInput.value);
  const endDT   = new Date(endInput.value+"T"+endTimeInput.value);

  const key = keywordInput.value.toLowerCase();
  const events=[];

  window._allEvents.forEach(ev=>{

    const s=new Date(ev.start);
    const e=new Date(ev.end);

    if(!showMemo){
      if(s<startDT || s>endDT) return;
    }

    if(key && !ev.title.toLowerCase().includes(key)) return;

    const dateStr = fmt(ymd(s));
    let startStr="",endStr="";

    if(!ev.allDay){
      startStr=pad2(s.getHours())+":"+pad2(s.getMinutes());
      endStr=pad2(e.getHours())+":"+pad2(e.getMinutes());
    }

    const desc=(ev.description==="This is an event reminder")?"":(ev.description||"");

    events.push({
      sort:s.getTime(),
      date:dateStr,
      start:startStr,
      end:endStr,
      title:ev.title||"",
      description:desc
    });
  });

  events.sort((a,b)=>a.sort-b.sort);
  window._lastRendered=events;

  const displayLines = events.map(ev=>{
    const header = ev.start
      ? `${ev.date} ${ev.start}-${ev.end} ${ev.title}`
      : `${ev.date} ${ev.title}`;

    return ev.description
      ? `${header}\n${ev.description}`
      : header;
  });

  output.textContent = displayLines.length
    ? displayLines.join("\n\n")
    : (showMemo?"メモはありません":"予定はありません");

  copyBtn.disabled = events.length===0;
}

/* ---------- コピー ---------- */
copyBtn.onclick = async ()=>{

  if(!window._lastRendered) return;

  const lines=[];

  window._lastRendered.forEach(ev=>{
    if(!ev.start) return;

    const firstLine = `${ev.start}${ev.title}${ev.end}`;

    if(ev.description){
      lines.push(firstLine);
      lines.push(ev.description);
    }else{
      lines.push(firstLine);
    }
  });

  if(lines.length===0) return;

  await navigator.clipboard.writeText(lines.join("\n"));
  alert("予定をコピーしました");
};

/* ---------- 見出し ---------- */
headingBtn.onclick=()=>{
  const ymd8=startInput.value.replace(/-/g,"");
  const d=new Date(startInput.value);
  const week=["日","月","火","水","木","金","土"][d.getDay()];
  output.textContent=`${fmt(ymd8)}(${week})`;
  copyBtn.disabled=true;
};

/* ---------- UI ---------- */
function enableUI(){
  [
    startInput,endInput,startTimeInput,endTimeInput,
    todayBtn,weekBtn,monthBtn,allBtn,
    memoBtn,loadBtn,headingBtn,copyBtn
  ].forEach(e=>e.disabled=false);
}

/* ---------- util ---------- */
function fmt(ymd){return`${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`;}
function ymd(d){return d.getFullYear().toString().padStart(4,'0')+(d.getMonth()+1).toString().padStart(2,'0')+d.getDate().toString().padStart(2,'0');}
function clamp(v){return v<minDate?minDate:v>maxDate?maxDate:v;}
function pad2(n){return n.toString().padStart(2,'0');}
</script>

</body>
</html>
