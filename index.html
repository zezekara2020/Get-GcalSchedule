<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予定一覧（JSON版対応）</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding:16px;}
.range { font-size:13px;color:#555;margin-bottom:8px;}
.controls{margin-bottom:12px;}
.controls label{margin-right:12px;}
button{padding:4px 10px;margin-right:4px;margin-top:4px;}
pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;font-size:14px;}
</style>
</head>
<body>

<h2>予定一覧</h2>
<div class="range" id="rangeInfo">読込中…</div>

<div class="controls">
<label>開始日：<input type="date" id="startDate" disabled></label>
<label>開始時刻：<input type="time" id="startTime" value="00:00" disabled></label>

<label>終了日：<input type="date" id="endDate" disabled></label>
<label>終了時刻：<input type="time" id="endTime" value="23:59" disabled></label>

<br><br>

<button id="todayBtn" disabled>今日</button>
<button id="weekBtn" disabled>今週</button>
<button id="monthBtn" disabled>今月</button>
<button id="allBtn" disabled>全期間</button>
<button id="loadBtn" disabled>表示</button>
<button id="copyBtn" disabled>コピー</button>
</div>

<pre id="out">初期化中…</pre>

<script>
const JSON_URL = "https://あなたのworker.example.com/"; // Cloudflare Worker URL

const startInput = document.getElementById("startDate");
const endInput = document.getElementById("endDate");
const startTimeInput = document.getElementById("startTime");
const endTimeInput   = document.getElementById("endTime");
const output = document.getElementById("out");

const todayBtn = document.getElementById("todayBtn");
const weekBtn  = document.getElementById("weekBtn");
const monthBtn = document.getElementById("monthBtn");
const allBtn   = document.getElementById("allBtn");
const loadBtn  = document.getElementById("loadBtn");
const copyBtn  = document.getElementById("copyBtn");
const rangeInfo = document.getElementById("rangeInfo");

let eventsData = [];

// ---------- 初期化 ----------
init();

async function init(){
  try{
    const res = await fetch(JSON_URL);
    if(!res.ok){
      output.textContent = `データ取得失敗: ${res.status}`;
      return;
    }
    eventsData = await res.json();

    if(!eventsData || eventsData.length===0){
      output.textContent = "予定はありません";
      enableUI();
      return;
    }

    const dates = eventsData.map(e=>new Date(e.start));
    const min = new Date(Math.min(...dates));
    const max = new Date(Math.max(...dates));

    startInput.value = min.toISOString().slice(0,10);
    endInput.value   = max.toISOString().slice(0,10);

    rangeInfo.textContent = `予定期間：${startInput.value} ～ ${endInput.value}`;
    output.textContent = "条件を指定してください";

    enableUI();
  } catch(err){
    console.error(err);
    output.textContent = "データ取得中にエラーが発生しました";
  }
}

// ---------- UI有効化 ----------
function enableUI(){
  [startInput, endInput, startTimeInput, endTimeInput,
   todayBtn, weekBtn, monthBtn, allBtn, loadBtn, copyBtn].forEach(e=>e.disabled=false);
}

// ---------- 日付補正 ----------
startInput.onchange = ()=>{ if(endInput.value < startInput.value) endInput.value = startInput.value; };

// ---------- 今日・今週・今月・全期間 ----------
todayBtn.onclick = ()=>{
  const d = new Date(); startInput.value = endInput.value = d.toISOString().slice(0,10);
};
weekBtn.onclick = ()=>{
  const d = new Date(); const w = d.getDay(); 
  const start = new Date(d); start.setDate(d.getDate()-(w===0?6:w-1));
  const end   = new Date(start); end.setDate(start.getDate()+6);
  startInput.value = start.toISOString().slice(0,10);
  endInput.value   = end.toISOString().slice(0,10);
};
monthBtn.onclick = ()=>{
  const d = new Date();
  const start = new Date(d.getFullYear(), d.getMonth(),1);
  const end   = new Date(d.getFullYear(), d.getMonth()+1,0);
  startInput.value = start.toISOString().slice(0,10);
  endInput.value   = end.toISOString().slice(0,10);
};
allBtn.onclick = ()=>{
  const dates = eventsData.map(e=>new Date(e.start));
  const min = new Date(Math.min(...dates));
  const max = new Date(Math.max(...dates));
  startInput.value = min.toISOString().slice(0,10);
  endInput.value   = max.toISOString().slice(0,10);
};

// ---------- 表示 ----------
loadBtn.onclick = render;

function render(){
  const sDate = new Date(startInput.value+"T"+startTimeInput.value);
  const eDate = new Date(endInput.value+"T"+endTimeInput.value);

  const lines = eventsData.filter(e=>{
    const start = new Date(e.start);
    return start>=sDate && start<=eDate;
  }).map(e=>{
    const start = new Date(e.start);
    const end   = new Date(e.end);
    const startH = start.toTimeString().slice(0,5);
    const endH   = end.toTimeString().slice(0,5);
    const desc = (e.description && e.description!=="This is an event reminder") ? e.description : "";
    return {
      display: `${start.toISOString().slice(0,10)} ${startH}-${endH} ${e.title}${desc?`\n${desc}`:""}`,
      copy: `${startH}${e.title}${endH}${desc?`\n${desc}`:""}`
    };
  });

  output.textContent = lines.length ? lines.map(l=>l.display).join("\n\n") : "予定はありません";
  output._copyData = lines.map(l=>l.copy);
  copyBtn.disabled = lines.length===0;
}

// ---------- コピー ----------
copyBtn.onclick = async ()=>{
  if(!output._copyData) return;
  try{
    await navigator.clipboard.writeText(output._copyData.join("\n"));
    alert("予定をコピーしました");
  } catch(err){
    console.error(err);
    alert("コピー失敗");
  }
};
</script>
</body>
</html>
