<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予定一覧（完全版）</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding:16px;}
.range { font-size:13px;color:#555;margin-bottom:8px;}
.controls{margin-bottom:12px;}
.controls label{margin-right:12px;}
button{padding:4px 10px;margin-right:4px;margin-top:4px;}
pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;font-size:14px;}
</style>
</head>
<body>

<h2>予定一覧</h2>
<div class="range" id="rangeInfo">読込中…</div>

<div class="controls">
<label>開始日：<input type="date" id="startDate" disabled></label>
<label>開始時刻：<input type="time" id="startTime" value="00:00" disabled></label>
<label>終了日：<input type="date" id="endDate" disabled></label>
<label>終了時刻：<input type="time" id="endTime" value="23:59" disabled></label>

<br><br>

<button id="todayBtn" disabled>今日</button>
<button id="weekBtn" disabled>今週</button>
<button id="monthBtn" disabled>今月</button>
<button id="allBtn" disabled>全期間</button>
<button id="memoBtn" disabled>メモ一覧</button>
<button id="headingBtn" disabled>見出し</button>

<label>検索：<input type="text" id="keyword"></label>
<button id="loadBtn" disabled>表示</button>
<button id="copyBtn" disabled>コピー</button>
</div>

<pre id="out">初期化中…</pre>

<script>
const JSON_URL="/api";

const startInput=document.getElementById("startDate");
const endInput=document.getElementById("endDate");
const startTimeInput=document.getElementById("startTime");
const endTimeInput=document.getElementById("endTime");
const keywordInput=document.getElementById("keyword");
const output=document.getElementById("out");

const todayBtn=document.getElementById("todayBtn");
const weekBtn=document.getElementById("weekBtn");
const monthBtn=document.getElementById("monthBtn");
const allBtn=document.getElementById("allBtn");
const memoBtn=document.getElementById("memoBtn");
const loadBtn=document.getElementById("loadBtn");
const copyBtn=document.getElementById("copyBtn");
const headingBtn=document.getElementById("headingBtn");
const rangeInfo=document.getElementById("rangeInfo");

let minDateObj=null;
let maxDateObj=null;

init();

/* ---------- 初期化 ---------- */
async function init(){
  try{
    const res=await fetch(JSON_URL,{
      headers:{
        "Authorization":"Basic "+btoa("tao:haltoto")
      }
    });

    if(!res.ok){
      output.textContent="取得失敗:"+res.status;
      return;
    }

    window._allEvents=await res.json();

    const normal=window._allEvents.filter(ev=>{
      const d=new Date(ev.start);
      return !isMemoDate(d);
    });

    if(normal.length===0){
      output.textContent="予定がありません";
      return;
    }

    const dates=normal.map(e=>new Date(e.start));
    minDateObj=new Date(Math.min(...dates));
    maxDateObj=new Date(Math.max(...dates));

    startInput.value=formatDate(minDateObj);
    endInput.value=formatDate(maxDateObj);

    rangeInfo.textContent=
      `予定期間：${formatDate(minDateObj)} ～ ${formatDate(maxDateObj)}`;

    enableUI();
    output.textContent="条件を指定してください";

  }catch(e){
    console.error(e);
    output.textContent="データ取得エラー";
  }
}

/* ---------- メモ判定 ---------- */
function isMemoDate(d){
  return d.getFullYear()===9999 &&
         d.getMonth()===11 &&
         d.getDate()===31 &&
         d.getHours()===23 &&
         d.getMinutes()===59;
}

/* ---------- 表示 ---------- */
function render(showMemo){

  const startDT=new Date(startInput.value+"T"+startTimeInput.value);
  const endDT=new Date(endInput.value+"T"+endTimeInput.value);

  const key=keywordInput.value.toLowerCase();
  const result=[];

  window._allEvents.forEach(ev=>{

    const s=new Date(ev.start);
    const e=new Date(ev.end);
    const memo=isMemoDate(s);

    if(showMemo){
      if(!memo) return;
    }else{
      if(memo) return;
      if(s<startDT||s>endDT) return;
    }

    if(key && !ev.title.toLowerCase().includes(key)) return;

    const desc=ev.description==="This is an event reminder"?"":(ev.description||"");

    result.push({
      sort: memo?0:s.getTime(),
      memo,
      date:formatDate(s),
      start:pad2(s.getHours())+":"+pad2(s.getMinutes()),
      end:pad2(e.getHours())+":"+pad2(e.getMinutes()),
      title:ev.title||"",
      description:desc
    });
  });

  result.sort((a,b)=>a.sort-b.sort);
  window._lastRendered=result;

  const lines=result.map(ev=>{
    if(showMemo){
      return ev.description
        ? `${ev.title}\n${ev.description}`
        : ev.title;
    }
    const head=`${ev.date} ${ev.start}-${ev.end} ${ev.title}`;
    return ev.description?`${head}\n${ev.description}`:head;
  });

  output.textContent=lines.length
    ? lines.join("\n\n")
    : (showMemo?"メモはありません":"予定はありません");

  copyBtn.disabled=result.length===0;
}

/* ---------- ボタン ---------- */
loadBtn.onclick=()=>render(false);
memoBtn.onclick=()=>render(true);

todayBtn.onclick=()=>{
  const t=new Date();
  startInput.value=formatDate(t);
  endInput.value=formatDate(t);
};

weekBtn.onclick=()=>{
  const d=new Date();
  const day=d.getDay();
  const monday=new Date(d);
  monday.setDate(d.getDate()-(day===0?6:day-1));
  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);
  startInput.value=formatDate(monday);
  endInput.value=formatDate(sunday);
};

monthBtn.onclick=()=>{
  const d=new Date();
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  startInput.value=formatDate(first);
  endInput.value=formatDate(last);
};

allBtn.onclick=()=>{
  startInput.value=formatDate(minDateObj);
  endInput.value=formatDate(maxDateObj);
};

headingBtn.onclick = () => {

  const dateStr = startInput.value; // YYYY-MM-DD
  if (!dateStr) return;

  const d = new Date(dateStr);
  const ymd8 = dateStr.replace(/-/g,"");
  const week = ["日","月","火","水","木","金","土"][d.getDay()];

  const holiday = getHolidayFromJSON(d);
  const sekki = getSekki(d);
  const sekku = getSekku(ymd8);

  let line = `${dateStr}(${week})`;

  if (holiday) line += ` 🎌${holiday}`;
  if (sekki) line += ` ${sekki}`;
  if (sekku) line += ` ${sekku}`;

  output.textContent = line;
  copyBtn.disabled = true;
};

/* ---------- コピー ---------- */
copyBtn.onclick=async()=>{
  if(!window._lastRendered) return;

  const lines=[];
  window._lastRendered.forEach(ev=>{
    if(ev.memo){
      lines.push(ev.title);
      if(ev.description) lines.push(ev.description);
    }else{
      lines.push(`${ev.start}${ev.title}${ev.end}`);
      if(ev.description) lines.push(ev.description);
    }
  });

  await navigator.clipboard.writeText(lines.join("\n"));
  alert("コピーしました");
};

function getHolidayFromJSON(dateObj){

  const target = formatDate(dateObj);

  const found = window._allEvents.find(ev => {
    if (!ev.allDay) return false;

    const d = new Date(ev.start);
    return formatDate(d) === target;
  });

  return found ? found.title : "";
}

function getSekku(ymd){
  const table = {
    "0107":"🌿人日",
    "0303":"🎎雛祭",
    "0505":"🎏端午",
    "0707":"🎋七夕",
    "0909":"🍶重陽"
  };
  return table[ymd.slice(4,8)] || "";
}

function getSekki(date){

  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();

  /* --- 2026年補正テーブル（正確値） --- */
  const fixed2026 = {
    "0105":"☀️小寒",
    "0120":"☀️大寒",
    "0204":"☀️立春",
    "0219":"☀️雨水",
    "0305":"☀️啓蟄",
    "0320":"☀️春分",
    "0405":"☀️清明",
    "0420":"☀️穀雨",
    "0505":"☀️立夏",
    "0521":"☀️小満",
    "0606":"☀️芒種",
    "0621":"☀️夏至",
    "0707":"☀️小暑",
    "0723":"☀️大暑",
    "0807":"☀️立秋",
    "0823":"☀️処暑",
    "0907":"☀️白露",
    "0923":"☀️秋分",
    "1008":"☀️寒露",
    "1023":"☀️霜降",
    "1107":"☀️立冬",
    "1122":"☀️小雪",
    "1207":"☀️大雪",
    "1222":"☀️冬至"
  };

  if(y === 2026){
    const key =
      m.toString().padStart(2,'0') +
      d.toString().padStart(2,'0');
    return fixed2026[key] || "";
  }

  /* --- それ以外は従来式（参考値） --- */

  const table = [
    {name:"☀️小寒",month:1,base:5.4055},
    {name:"☀️大寒",month:1,base:20.12},
    {name:"☀️立春",month:2,base:4.87},
    {name:"☀️雨水",month:2,base:19.73},
    {name:"☀️啓蟄",month:3,base:5.63},
    {name:"☀️春分",month:3,base:20.646},
    {name:"☀️清明",month:4,base:4.81},
    {name:"☀️穀雨",month:4,base:20.1},
    {name:"☀️立夏",month:5,base:5.52},
    {name:"☀️小満",month:5,base:21.04},
    {name:"☀️芒種",month:6,base:5.678},
    {name:"☀️夏至",month:6,base:21.37},
    {name:"☀️小暑",month:7,base:7.108},
    {name:"☀️大暑",month:7,base:22.83},
    {name:"☀️立秋",month:8,base:7.5},
    {name:"☀️処暑",month:8,base:23.13},
    {name:"☀️白露",month:9,base:7.646},
    {name:"☀️秋分",month:9,base:23.2488},
    {name:"☀️寒露",month:10,base:8.318},
    {name:"☀️霜降",month:10,base:23.438},
    {name:"☀️立冬",month:11,base:7.438},
    {name:"☀️小雪",month:11,base:22.36},
    {name:"☀️大雪",month:12,base:7.18},
    {name:"☀️冬至",month:12,base:21.94}
  ];

  for(const s of table){
    if(s.month !== m) continue;

    const day = Math.floor(
      s.base + 0.242194*(y-1980) - Math.floor((y-1980)/4)
    );

    if(day === d) return s.name;
  }

  return "";
}


/* ---------- util ---------- */
function enableUI(){
  [
    startInput,endInput,startTimeInput,endTimeInput,
    todayBtn,weekBtn,monthBtn,allBtn,
    memoBtn,loadBtn,headingBtn,copyBtn
  ].forEach(e=>e.disabled=false);
}

function formatDate(d){
  return d.getFullYear()+"-"+
    pad2(d.getMonth()+1)+"-"+
    pad2(d.getDate());
}

function pad2(n){return n.toString().padStart(2,'0');}
</script>
</body>
</html>
